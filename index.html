<!DOCTYPE html>
<html lang="sk" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoMech Pro – Konkrétne poistky, náhľad dielov a umiestnenie na aute</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #090d16; color: #f1f5f9; overflow-x: hidden; }
    .blueprint-grid {
      background-color: #0b1120;
      background-image:
        linear-gradient(to right, rgba(148, 163, 184, 0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
  <header class="border-b border-slate-800 bg-slate-950/90 sticky top-0 z-20 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-amber-500 text-slate-950 font-extrabold flex items-center justify-center text-sm">AM</div>
        <div>
          <div class="font-bold text-base leading-tight">AutoMech Pro</div>
          <div class="text-xs text-slate-400">Číslovanie poistiek • Náhľad dielov • Kde patria na aute</div>
        </div>
      </div>
      <span class="text-xs px-2.5 py-1 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30 font-medium">
        Všetky motorizácie
      </span>
    </div>
  </header>

  <main class="max-w-6xl w-full mx-auto px-4 py-6 space-y-6 flex-1">
    <!-- Krok 1: Výber vozidla, ročníka a motorizácie -->
    <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-4">
      <div class="flex flex-col md:flex-row md:items-center justify-between gap-2.5">
        <div>
          <div class="text-xs uppercase tracking-wider text-amber-400 font-semibold">Krok 1 • Výber vozidla a motora</div>
          <h1 class="text-lg sm:text-xl font-bold">Značka, model, ročník a motorizácia</h1>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 w-full md:w-auto">
          <input id="brandFilter" type="text" placeholder="Hľadať značku..."
            class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500" />
          <input id="engineFilter" type="text" placeholder="Hľadať motorizáciu / kód (napr. 2.0 GTI, AXX, 1.9 TDI)..."
            class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500" />
        </div>
      </div>

      <div id="brandGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2.5"></div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Model a ročník</label>
          <select id="modelSelect" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500"></select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Motorizácia (všetky dostupné verzie)</label>
          <select id="engineSelect" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500"></select>
        </div>
      </div>

      <div id="activeVehicleBanner" class="rounded-xl bg-slate-950/80 border border-slate-800 px-3.5 py-2.5 text-xs sm:text-sm flex flex-wrap items-center justify-between gap-2"></div>
    </section>

    <!-- Krok 2: Konkrétne číslovanie poistiek pre zvolené vozidlo -->
    <section id="fuseBoxSection" class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-4"></section>

    <!-- Krok 3: Kompletný náhľad dielov a kde patria na konkrétnom aute -->
    <section id="partsOverviewSection" class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-4"></section>

    <!-- Krok 4: Uzol, poruchy, postup opravy, schéma a ceny -->
    <section class="grid grid-cols-1 lg:grid-cols-12 gap-5">
      <div class="lg:col-span-5 bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="font-bold text-base">Uzly vozidla a schéma</h2>
          <span class="text-xs text-slate-400">Ťuknite na uzol</span>
        </div>

        <div class="blueprint-grid rounded-xl border border-slate-800 p-3">
          <svg viewBox="0 0 600 250" class="w-full h-auto select-none">
            <path d="M65 170 L102 112 L212 96 L325 93 L472 103 L535 138 L540 172 L485 172 A34 34 0 0 0 417 172 L185 172 A34 34 0 0 0 117 172 L65 170 Z"
                  fill="rgba(30,41,59,0.55)" stroke="#64748b" stroke-width="2.5" />
            <path d="M132 112 L215 66 L358 66 L438 103 Z" fill="rgba(51,65,85,0.35)" stroke="#94a3b8" stroke-width="2" />
            <circle cx="151" cy="172" r="30" fill="#0f172a" stroke="#cbd5e1" stroke-width="3" />
            <circle cx="151" cy="172" r="13" fill="#1e293b" stroke="#64748b" stroke-width="2" />
            <circle cx="451" cy="172" r="30" fill="#0f172a" stroke="#cbd5e1" stroke-width="3" />
            <circle cx="451" cy="172" r="13" fill="#1e293b" stroke="#64748b" stroke-width="2" />

            <g class="cursor-pointer" onclick="selectPart('battery')">
              <circle cx="115" cy="134" r="10" fill="#f59e0b" opacity="0.28" />
              <circle cx="115" cy="134" r="5.5" fill="#f59e0b" />
              <text x="115" y="118" text-anchor="middle" fill="#fde68a" font-size="10.5" font-family="Inter">Batéria</text>
            </g>

            <g class="cursor-pointer" onclick="selectPart('engine')">
              <circle cx="205" cy="132" r="10" fill="#38bdf8" opacity="0.28" />
              <circle cx="205" cy="132" r="5.5" fill="#38bdf8" />
              <text x="205" y="116" text-anchor="middle" fill="#bae6fd" font-size="10.5" font-family="Inter">Motor/Rozvody</text>
            </g>

            <g class="cursor-pointer" onclick="selectPart('cooling')">
              <circle cx="150" cy="146" r="9" fill="#22d3ee" opacity="0.25" />
              <circle cx="150" cy="146" r="5" fill="#22d3ee" />
              <text x="82" y="152" text-anchor="middle" fill="#a5f3fc" font-size="10" font-family="Inter">Chladenie</text>
            </g>

            <g class="cursor-pointer" onclick="selectPart('drivetrain')">
              <circle cx="255" cy="166" r="10" fill="#c084fc" opacity="0.25" />
              <circle cx="255" cy="166" r="5.5" fill="#c084fc" />
              <text x="255" y="192" text-anchor="middle" fill="#e9d5ff" font-size="10.5" font-family="Inter">Spojka/Pohon</text>
            </g>

            <g class="cursor-pointer" onclick="selectPart('exhaust')">
              <circle cx="338" cy="155" r="10" fill="#f87171" opacity="0.25" />
              <circle cx="338" cy="155" r="5.5" fill="#f87171" />
              <text x="338" y="140" text-anchor="middle" fill="#fecaca" font-size="10.5" font-family="Inter">Výfuk/EGR/DPF</text>
            </g>

            <g class="cursor-pointer" onclick="selectPart('brakes')">
              <circle cx="451" cy="172" r="10" fill="#34d399" opacity="0.28" />
              <circle cx="451" cy="172" r="5.5" fill="#34d399" />
              <text x="451" y="218" text-anchor="middle" fill="#a7f3d0" font-size="10.5" font-family="Inter">Brzdy/Podvozok</text>
            </g>

            <g class="cursor-pointer" onclick="selectPart('electrics')">
              <circle cx="290" cy="86" r="10" fill="#facc15" opacity="0.25" />
              <circle cx="290" cy="86" r="5.5" fill="#facc15" />
              <text x="290" y="54" text-anchor="middle" fill="#fef08a" font-size="10.5" font-family="Inter">Elektrika/Snímače</text>
            </g>
          </svg>
        </div>

        <div id="partButtons" class="grid grid-cols-2 gap-2"></div>
      </div>

      <div id="partDetailCard" class="lg:col-span-7 bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-4"></div>
    </section>

    <!-- Krok 5: Servisný plán a overenie podľa VIN -->
    <section id="eraServiceSection" class="grid grid-cols-1 lg:grid-cols-2 gap-5"></section>
    <section id="vinChecklistSection" class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-3"></section>
  </main>

          { name: "Brzdové kotúče a platničky", where: "Na prednej alebo zadnej náprave za diskom kolesa" },
          { name: "Rameno / silentbloky / čap riadenia", where: "Na prednej náprave podvozka pri kolese" },
          { name: "Tyčky stabilizátora / tlmiče", where: "Na prednej alebo zadnej náprave podvozka" }
        ],
        diy: "50 – 240 €",
        service: "120 – 450 €"
      },
      electrics: {
        label: "🔌 Elektrika & snímače",
        title: "Elektrika, poistky, riadenie a snímače",
        locations: [
          "Motorová poistková skrinka: v motorovom priestore pri batérii alebo stene kabíny pod krytom.",
          "Kabínová poistková skrinka: na ľavom boku palubnej dosky pri dverách vodiča, pod volantom alebo v priehradke.",
          "Snímače ABS a váha vzduchu (MAF): ABS pri náboji každého kolesa, MAF na sacom potrubí za vzduchovým filtrom."
        ],
        faults: [
          "Prepálená poistka alebo chybné relé (nefunguje konkrétny okruh).",
          "Chybný snímač alebo poškodený kábel/konektor.",
          "Zvýšený odber prúdu v pokoji (vybíjanie batérie)."
        ],
        howToFix: [
          "Vyberte podozrivú poistku zo správneho boxu a skontrolujte jej prepoj alebo napätie.",
          "Skontrolujte konektor a kabeláž skôr, než vymeníte snímač.",
          "Pri nočnom vybíjaní batérie zmerajte odber v pokoji a postupne skúšajte okruhy/poistky."
        ],
        schematic: "Batéria (+) -> Hlavná poistka -> Poistkový box (Motor / Kabína) -> Relé / Spínač / Riadiaca jednotka -> Snímač alebo Akčný člen -> Kostra (-).",
        partsList: [
          { name: "Náhradné poistky & relé", where: "Motorový a kabínový poistkový box" },
          { name: "Snímač ABS / otáčok kolesa", where: "Pri náboji každého kolesa na podvozku" },
          { name: "Váha vzduchu (MAF) / snímače", where: "Sacie potrubie za vzduchovým filtrom / motor" }
        ],
        diy: "20 – 160 €",
        service: "70 – 260 €"
      }
    };

    const partKeys = Object.keys(PARTS);
    const brandKeys = Object.keys(DB);
    let selectedBrand = "Škoda";
    let selectedModelIdx = 0;
    let selectedEngineValue = "";
    let selectedPart = "battery";
    let activeFuseTab = "engineBox";

    function getFilteredEngines() {
      const allEngines = DB[selectedBrand].models[selectedModelIdx].engines;
      const q = document.getElementById("engineFilter").value.trim().toLowerCase();
      if (!q) return allEngines;
      const matches = allEngines.filter(e => e.toLowerCase().includes(q));
      return matches.length ? matches : allEngines;
    }

    function getActiveEngineLabel() {
      const list = getFilteredEngines();
      return list.includes(selectedEngineValue) ? selectedEngineValue : list[0];
    }

    function getFuseDataForModel(modelName) {
      return SPECIFIC_FUSES[modelName] || DEFAULT_FUSES;
    }

    function parseEraInfo(modelName) {
      const matches = [...modelName.matchAll(/(19\d\d|20\d\d)/g)].map(m => Number(m[1]));
      const startYear = matches.length ? matches[0] : 2005;
      if (startYear >= 2012) {
        return {
          badge: "Novšia éra (od ~2012+)",
          summary: "Viac riadiacich jednotiek, emisných systémov (DPF/AdBlue/GPF), BMS/Start-Stop a elektroniky. Pri opravách je kľúčová diagnostika a správne údaje podľa VIN.",
          focus: "Overte presnú revíziu motora/kódu, stav batérie/BMS, emisie a servisné intervaly podľa štýlu jazdy."
        };
      }
      return {
        badge: "Staršia / klasická éra (do ~2011)",
        summary: "Jednoduchšia mechanika a priamejší prístup k uzlom, no vyššie opotrebenie vekom, korózia, gumené/plastové diely, podtlaky a úniky kvapalín.",
        focus: "Sledujte koróziu podvozka/brzdových trubiek, netesnosti, opotrebenie čapov/silentblokov a predošlý servis."
      };
    }

    function getServicePlan(engineLabel) {
      const e = engineLabel.toLowerCase();
      const isDiesel = e.includes("tdi") || e.includes("cdi") || e.includes("hdi") || e.includes("dci") || e.includes("tdci") || e.includes("crdi") || e.includes("d-4d") || e.includes("cdti") || e.includes("jtd") || e.includes("multijet") || e.includes("d2") || e.includes("d3") || e.includes("d4") || e.includes("d5") || e.includes("td") || e.includes(" d");
      const isHybrid = e.includes("hybrid") || e.includes("e-power") || e.includes("e:hev");

      return {
        engineType: isDiesel ? "Vznetový motor (Diesel)" : (isHybrid ? "Hybrid / elektrifikovaný pohon" : "Zážihový motor (Benzín / LPG)"),
        oilInterval: isDiesel ? "10 000 – 15 000 km alebo 1 rok (zvoľte kratší pri krátkych trasách)" : "10 000 – 15 000 km alebo 1 rok",
        timingNote: "Rozvody (remeň alebo reťaz) a vodnú pumpu riaďte presne podľa kódu motora a dielenského plánu.",
        fluids: [
          isDiesel ? "Motorový olej podľa špecifikácie výrobcu pre diesel + DPF (ak je prítomný)" : "Motorový olej podľa viskozity a normy výrobcu pre benzín",
          "Brzdová kvapalina (spravidla DOT 4 – výmena každé ~2 roky)",
          "Chladiaca kvapalina (správna farba/norma podľa výrobcu) + prevodový olej"
        ]
      };
    }

    function renderBrands(filterText = "") {
      const grid = document.getElementById("brandGrid");
      const q = filterText.trim().toLowerCase();
      const filtered = brandKeys.filter(b => b.toLowerCase().includes(q) || DB[b].code.toLowerCase().includes(q));
      if (filtered.length && !filtered.includes(selectedBrand)) {
        selectedBrand = filtered[0];
        selectedModelIdx = 0;
      }
      grid.innerHTML = filtered.map(brand => {
        const active = brand === selectedBrand;
        return `<button onclick="chooseBrand('${brand}')" class="p-3 rounded-xl border text-left transition ${
          active
            ? "bg-amber-500/15 border-amber-500 text-amber-200"
            : "bg-slate-950/70 border-slate-800 text-slate-200 hover:border-slate-600"
        }">
          <div class="font-mono text-xs font-bold ${active ? "text-amber-400" : "text-slate-400"}">${DB[brand].code}</div>
          <div class="text-sm font-semibold truncate">${brand}</div>
        </button>`;
      }).join("");
      renderModels();
    }

    function chooseBrand(brand) {
      selectedBrand = brand;
      selectedModelIdx = 0;
      renderBrands(document.getElementById("brandFilter").value);
    }

    function renderModels() {
      const models = DB[selectedBrand].models;
      if (selectedModelIdx >= models.length) selectedModelIdx = 0;
      const modelSelect = document.getElementById("modelSelect");
      modelSelect.innerHTML = models.map((m, i) => `<option value="${i}" ${i === selectedModelIdx ? "selected" : ""}>${m.name}</option>`).join("");
      modelSelect.onchange = () => {
        selectedModelIdx = Number(modelSelect.value);
        selectedEngineValue = DB[selectedBrand].models[selectedModelIdx].engines[0];
        renderEngines();
      };
      selectedEngineValue = models[selectedModelIdx].engines[0];
      renderEngines();
    }

    function renderEngines() {
      const list = getFilteredEngines();
      if (!list.includes(selectedEngineValue)) selectedEngineValue = list[0];
      const engineSelect = document.getElementById("engineSelect");
      engineSelect.innerHTML = list.map(e => `<option value="${e.replace(/"/g, '&quot;')}" ${e === selectedEngineValue ? "selected" : ""}>${e}</option>`).join("");
      engineSelect.onchange = () => {
        selectedEngineValue = engineSelect.value;
        updateBanner();
      };
      updateBanner();
    }

    function renderFuseSection() {
      const modelName = DB[selectedBrand].models[selectedModelIdx].name;
      const engineName = getActiveEngineLabel();
      const fuseData = getFuseDataForModel(modelName);
      const rows = fuseData[activeFuseTab] || fuseData.engineBox;

      document.getElementById("fuseBoxSection").innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <div class="text-xs uppercase tracking-wider text-sky-400 font-semibold">Krok 2 • Číslovanie poistiek a k čomu patria</div>
            <h2 class="font-bold text-base sm:text-lg">Poistky pre: ${selectedBrand} ${modelName}</h2>
            <div class="text-xs text-slate-400 font-mono">${engineName}</div>
          </div>
          <div class="flex gap-2">
            <button onclick="switchFuseTab('engineBox')" class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition ${
              activeFuseTab === "engineBox" ? "bg-sky-500/20 border-sky-400 text-sky-200" : "bg-slate-950 border-slate-700 text-slate-300"
            }">Motorové poistky</button>
            <button onclick="switchFuseTab('cabinBox')" class="px-3 py-1.5 rounded-xl text-xs font-semibold border transition ${
              activeFuseTab === "cabinBox" ? "bg-sky-500/20 border-sky-400 text-sky-200" : "bg-slate-950 border-slate-700 text-slate-300"
            }">Kabínové poistky</button>
          </div>
        </div>

        <p class="text-xs text-slate-300 bg-slate-950/80 border border-slate-800 rounded-xl p-3">${fuseData.note}</p>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
          ${rows.map(r => `
            <div class="rounded-xl bg-slate-950 border border-slate-800 p-3.5 space-y-1.5">
              <div class="flex items-center justify-between gap-2">
                <span class="font-mono text-xs font-bold px-2 py-0.5 rounded bg-amber-500/15 text-amber-300 border border-amber-500/30">${r.num}</span>
                <span class="font-mono text-xs font-semibold text-sky-300">${r.amp}</span>
              </div>
              <div class="text-sm font-bold text-slate-100">${r.circuit}</div>
              <div class="text-xs text-slate-400"><strong class="text-slate-300">Kde hľadať:</strong> ${r.where}</div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function switchFuseTab(tab) {
      activeFuseTab = tab;
      renderFuseSection();
    }

    function renderPartsOverview() {
      const modelName = DB[selectedBrand].models[selectedModelIdx].name;
      const engineName = getActiveEngineLabel();

      document.getElementById("partsOverviewSection").innerHTML = `
        <div>
          <div class="text-xs uppercase tracking-wider text-emerald-400 font-semibold">Krok 3 • Náhľad dielov a kde patria na vozidle</div>
          <h2 class="font-bold text-base sm:text-lg">Prehľad dielov pre ${selectedBrand} ${modelName}</h2>
          <div class="text-xs text-slate-400 font-mono">${engineName} • Kliknutím na „Detail uzla“ otvoríte poruchy, postup opravy a schému</div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">
          ${partKeys.map(key => {
            const p = PARTS[key];
            return `
              <div class="rounded-xl bg-slate-950/90 border border-slate-800 p-3.5 flex flex-col justify-between space-y-3">
                <div class="space-y-2">
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-sm font-bold text-amber-300">${p.label}</span>
                    <button onclick="jumpToPart('${key}')" class="text-xs px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700">Detail uzla</button>
                  </div>
                  <div class="space-y-1.5">
                    ${p.partsList.map(item => `
                      <div class="text-xs border-t border-slate-800/80 pt-1.5">
                        <div class="font-semibold text-slate-100">${item.name}</div>
                        <div class="text-slate-400">Kde patrí: <span class="text-slate-300">${item.where}</span></div>
                      </div>
                    `).join("")}
                  </div>
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
    }

    function jumpToPart(key) {
      selectedPart = key;
      renderPartButtons();
      renderPartCard();
      document.getElementById("partDetailCard").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function renderEraAndService() {
      const modelName = DB[selectedBrand].models[selectedModelIdx].name;
      const engineName = getActiveEngineLabel();
      const era = parseEraInfo(modelName);
      const plan = getServicePlan(engineName);

      document.getElementById("eraServiceSection").innerHTML = `
        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-2.5">
          <div class="flex items-center justify-between gap-2">
            <h2 class="font-bold text-base">Profil ročníka a generácie</h2>
            <span class="text-xs px-2.5 py-0.5 rounded-full bg-slate-800 text-amber-300 border border-slate-700">${era.badge}</span>
          </div>
          <div class="text-xs text-slate-400">${selectedBrand} • ${modelName}</div>
          <p class="text-sm text-slate-200 leading-relaxed">${era.summary}</p>
          <p class="text-xs text-slate-300 bg-slate-950/80 border border-slate-800 rounded-xl p-3"><strong class="text-amber-300">Na čo sa zamerať:</strong> ${era.focus}</p>
        </div>

        <div class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-2.5">
          <div class="flex items-center justify-between gap-2">
            <h2 class="font-bold text-base">Servisný plán a prevádzkové kvapaliny</h2>
            <span class="text-xs text-slate-400">${plan.engineType}</span>
          </div>
          <div class="text-sm text-slate-200"><strong>Výmena oleja a filtrov:</strong> ${plan.oilInterval}</div>
          <div class="text-xs text-slate-300">${plan.timingNote}</div>
          <ul class="list-disc list-inside space-y-1 text-xs sm:text-sm text-slate-300 pt-1">
            ${plan.fluids.map(f => `<li>${f}</li>`).join("")}
          </ul>
        </div>
      `;
    }

    function renderPartButtons() {
      const container = document.getElementById("partButtons");
      container.innerHTML = partKeys.map(k => {
        const active = k === selectedPart;
        return `<button onclick="selectPart('${k}')" class="px-3 py-2 rounded-xl border text-xs font-medium text-left transition ${
          active
            ? "bg-amber-500/20 border-amber-500 text-amber-200"
            : "bg-slate-800/80 border-slate-700 text-slate-200 hover:bg-slate-800"
        }">${PARTS[k].label}</button>`;
      }).join("");
    }

    function renderVinChecklist() {
      const modelName = DB[selectedBrand].models[selectedModelIdx].name;
      const engineName = getActiveEngineLabel();
      document.getElementById("vinChecklistSection").innerHTML = `
        <h2 class="font-bold text-base">Pred nákupom dielov a servisom si overte</h2>
        <div class="text-xs text-slate-400">Aktuálny výber: <span class="text-slate-200 font-medium">${selectedBrand} ${modelName}</span> • <span class="font-mono text-amber-300">${engineName}</span></div>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 pt-1">
          <div class="rounded-xl bg-slate-950/80 border border-slate-800 p-3.5 space-y-1">
            <div class="text-xs font-semibold text-amber-300">1. VIN a údaje z techničáku</div>
            <p class="text-xs text-slate-300">17-miestny VIN kód, presný rok/mesiac výroby, výkon v kW a kód motora odlišujú diely, ktoré vyzerajú podobne, no nesedia.</p>
          </div>
          <div class="rounded-xl bg-slate-950/80 border border-slate-800 p-3.5 space-y-1">
            <div class="text-xs font-semibold text-amber-300">2. OEM katalógy a diely</div>
            <p class="text-xs text-slate-300">Pri objednávaní bŕzd, spojky, snímačov alebo rozvodov overte originálne číslo (OEM) alebo rozmery.</p>
          </div>
          <div class="rounded-xl bg-slate-950/80 border border-slate-800 p-3.5 space-y-1">
            <div class="text-xs font-semibold text-amber-300">3. Dielenský manuál a momenty</div>
            <p class="text-xs text-slate-300">Pre presné uťahovacie momenty, nastavenie rozvodov, elektrické schémy a adaptácie použite dielenskú dokumentáciu pre daný kód motora.</p>
          </div>
        </div>
      `;
    }

    function updateBanner() {
      const modelName = DB[selectedBrand].models[selectedModelIdx].name;
      const engineName = getActiveEngineLabel();
      document.getElementById("activeVehicleBanner").innerHTML = `
        <div><span class="text-slate-400">Aktívne vozidlo:</span> <strong class="text-amber-300">${selectedBrand} ${modelName}</strong></div>
        <div class="font-mono text-xs text-slate-300">${engineName}</div>
      `;
      renderFuseSection();
      renderPartsOverview();
      renderEraAndService();
      renderPartButtons();
      renderPartCard();
      renderVinChecklist();
    }

    function selectPart(key) {
      selectedPart = key;
      renderPartButtons();
      renderPartCard();
    }

    function renderPartCard() {
      const p = PARTS[selectedPart];
      const modelName = DB[selectedBrand].models[selectedModelIdx].name;
      const engineName = getActiveEngineLabel();
      document.getElementById("partDetailCard").innerHTML = `
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div class="text-xs text-amber-400 font-semibold">${selectedBrand} • ${modelName}</div>
          <div class="text-xs font-mono text-slate-400">${engineName}</div>
        </div>
        <h3 class="text-lg font-bold">${p.title}</h3>

        <div class="rounded-xl bg-slate-950/90 border border-slate-800 p-3 space-y-1">
          <div class="text-xs font-semibold uppercase tracking-wider text-amber-300">Kde sa diely nachádzajú na aute</div>
          <ul class="list-disc list-inside space-y-1 text-xs text-slate-200">
            ${p.locations.map(loc => `<li>${loc}</li>`).join("")}
          </ul>
        </div>

        <div class="space-y-1">
          <div class="text-xs font-semibold uppercase tracking-wider text-rose-300">Typické poruchy tohto uzla / dielu</div>
          <ul class="list-disc list-inside space-y-1 text-xs sm:text-sm text-slate-200">
            ${p.faults.map(f => `<li>${f}</li>`).join("")}
          </ul>
        </div>

        <div class="space-y-1">
          <div class="text-xs font-semibold uppercase tracking-wider text-amber-300">Čo treba opraviť a ako postupovať</div>
          <ol class="list-decimal list-inside space-y-1.5 text-xs sm:text-sm text-slate-200">
            ${p.howToFix.map(s => `<li>${s}</li>`).join("")}
          </ol>
        </div>

        <div class="rounded-xl bg-slate-950/90 border border-slate-800 p-3 space-y-1">
          <div class="text-xs font-semibold uppercase tracking-wider text-purple-300">Prehľad schémy zapojenia / okruhu</div>
          <p class="font-mono text-xs text-slate-200 leading-relaxed">${p.schematic}</p>
        </div>

        <div class="grid grid-cols-2 gap-2.5 pt-1">
          <div class="rounded-xl bg-emerald-950/50 border border-emerald-700/40 p-3">
            <div class="text-[11px] text-emerald-300">Svojpomocne (diel)</div>
            <div class="font-bold text-sm text-emerald-200">${p.diy}</div>
          </div>
          <div class="rounded-xl bg-slate-950 border border-slate-800 p-3">
            <div class="text-[11px] text-slate-400">Autoservis (orientačne)</div>
            <div class="font-bold text-sm text-slate-100">${p.service}</div>
          </div>
        </div>
      `;
    }

    document.getElementById("brandFilter").addEventListener("input", (e) => renderBrands(e.target.value));
    document.getElementById("engineFilter").addEventListener("input", () => renderEngines());
    renderBrands();
  </script>
</body>
</html>
