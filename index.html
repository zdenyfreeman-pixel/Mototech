<!DOCTYPE html>
<html lang="sk" class="dark">
<head>
  <meta charset="UTF-8" />

  <title>AutoMech Pro – Interaktívny sprievodca opravami a dielmi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #090d16; color: #f1f5f9; overflow-x: hidden; }
    .blueprint-grid {
      background-color: #0b1120;
      background-image:
        linear-gradient(to right, rgba(148, 163, 184, 0.06) 1px, transparent 1px),

    }

<body class="min-h-screen flex flex-col">
  <header class="border-b border-slate-800 bg-slate-950/90 sticky top-0 z-20 backdrop-blur">
    <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-amber-500 text-slate-950 font-extrabold flex items-center justify-center text-sm">AM</div>
        <div>
          <div class="font-bold text-base leading-tight">AutoMech Pro</div>
          <div class="text-xs text-slate-400">Komplet ročníky • Servis, schéma a diely</div>
        </div>
      </div>
      <span class="text-xs px-2.5 py-1 rounded-full bg-amber-500/15 text-amber-300 border border-amber-500/30 font-medium">
        Všetky ročníky
      </span>
    </div>
  </header>

  <main class="max-w-5xl w-full mx-auto px-4 py-6 space-y-6 flex-1">
    <section class="bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-4">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div>
          <div class="text-xs uppercase tracking-wider text-amber-400 font-semibold">Krok 1 • Výber vozidla</div>
          <h1 class="text-lg sm:text-xl font-bold">Značka, model, ročník a motorizácia</h1>
        </div>
        <input id="brandFilter" type="text" placeholder="Filtrovať značku (napr. Škoda, VW, BMW, Opel)..."
          class="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-500 w-full sm:w-72" />
      </div>

      <div id="brandGrid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-2.5"></div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Model a ročník</label>
          <select id="modelSelect" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500"></select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Motorizácia a kód motora</label>
          <select id="engineSelect" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500"></select>
        </div>
      </div>

      <div id="activeVehicleBanner" class="rounded-xl bg-slate-950/80 border border-slate-800 px-3.5 py-2.5 text-xs sm:text-sm flex flex-wrap items-center justify-between gap-2"></div>
    </section>

    <section class="grid grid-cols-1 lg:grid-cols-12 gap-5">
      <div class="lg:col-span-7 bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-3">
        <div class="flex items-center justify-between">
          <h2 class="font-bold text-base">Interaktívna schéma uzlov</h2>
          <span class="text-xs text-slate-400">Ťuknite na bod v schéme</span>
        </div>

        <div class="blueprint-grid rounded-xl border border-slate-800 p-3">
          <svg viewBox="0 0 600 240" class="w-full h-auto select-none">
            <path d="M70 165 L105 110 L215 95 L320 92 L465 102 L530 135 L535 168 L480 168 A34 34 0 0 0 412 168 L188 168 A34 34 0 0 0 120 168 L70 165 Z"
                  fill="rgba(30,41,59,0.55)" stroke="#64748b" stroke-width="2.5" />
            <path d="M135 110 L218 65 L355 65 L435 102 Z" fill="rgba(51,65,85,0.35)" stroke="#94a3b8" stroke-width="2" />

            <circle cx="154" cy="168" r="13" fill="#1e293b" stroke="#64748b" stroke-width="2" />
            <circle cx="446" cy="168" r="30" fill="#0f172a" stroke="#cbd5e1" stroke-width="3" />
            <circle cx="446" cy="168" r="13" fill="#1e293b" stroke="#64748b" stroke-width="2" />

            <g class="cursor-pointer" onclick="selectPart('battery')">
              <circle cx="122" cy="132" r="11" fill="#f59e0b" opacity="0.25" />
              <circle cx="122" cy="132" r="6" fill="#f59e0b" />
              <text x="122" y="116" text-anchor="middle" fill="#fde68a" font-size="11" font-family="Inter">Batéria</text>
            </g>

            <g class="cursor-pointer" onclick="selectPart('engine')">
              <circle cx="205" cy="132" r="11" fill="#38bdf8" opacity="0.25" />
              <circle cx="205" cy="132" r="6" fill="#38bdf8" />
              <text x="205" y="116" text-anchor="middle" fill="#bae6fd" font-size="11" font-family="Inter">Motor / Snímače</text>
            </g>

            <g class="cursor-pointer" onclick="selectPart('brakes')">
              <circle cx="446" cy="168" r="11" fill="#34d399" opacity="0.25" />
              <circle cx="446" cy="168" r="6" fill="#34d399" />
              <text x="446" y="212" text-anchor="middle" fill="#a7f3d0" font-size="11" font-family="Inter">Brzdy / Podvozok</text>
            </g>

            <g class="cursor-pointer" onclick="selectPart('exhaust')">
              <circle cx="315" cy="152" r="11" fill="#f87171" opacity="0.25" />
              <circle cx="315" cy="152" r="6" fill="#f87171" />
              <text x="315" y="140" text-anchor="middle" fill="#fecaca" font-size="11" font-family="Inter">Výfuk / EGR / DPF</text>
            </g>
          </svg>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
          <button onclick="selectPart('battery')" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-left">🔋 Batéria & štart</button>
          <button onclick="selectPart('engine')" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-left">⚙️ Motor & rozvody</button>
          <button onclick="selectPart('brakes')" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-left">🛑 Brzdy & podvozok</button>
          <button onclick="selectPart('exhaust')" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-medium text-left">💨 Emisie & výfuk</button>
        </div>

      <div id="partDetailCard" class="lg:col-span-5 bg-slate-900/90 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-3"></div>
    </section>

          { name: "Accord VII / Civic VII–VIII (2001–2011)", engines: ["2.2 i-CTDi (103 kW / N22A1)", "2.0 / 2.4 i-VTEC (K20 / K24)"] },
          { name: "CR-V / Civic X–XI (2007–2026)", engines: ["1.6 / 2.2 i-DTEC (88/110/118 kW)", "1.5 VTEC Turbo / e:HEV Hybrid"] }
        ]
      },
      "Nissan": {
        code: "NIS",
        models: [
          { name: "Primera P10 / P11 / Almera N15–N16 (1990–2006)", engines: ["2.0 TD / Di (55/66/81 kW)", "1.6 / 1.8 / 2.0 (GA16 / SR20)"] },
          { name: "X-Trail T30 / T31 / Qashqai J10 (2001–2013)", engines: ["2.0 / 2.2 dCi (84/100/110/127 kW)"] },
          { name: "Qashqai J11–J12 / X-Trail T32–T33 (2014–2026)", engines: ["1.5 / 1.6 / 1.7 dCi (81/96/110 kW)", "1.3 DIG-T / e-POWER"] }
        ]
      },
      "Mazda": {
        code: "MAZ",
        models: [
          { name: "323 / 626 (1989–2002)", engines: ["2.0 DiTD / Comprex", "1.6 / 1.8 / 2.0"] },
          { name: "Mazda 3 BK / BL / BM / BP (2003–2026)", engines: ["1.6 / 2.0 / 2.2 CD (80/85/103/110 kW)", "2.0 Skyactiv-G / Skyactiv-X"] },
          { name: "Mazda 6 GG / GH / GJ (2002–2024)", engines: ["2.0 / 2.2 CD (89/103/110/129 kW)", "2.0 / 2.5 Skyactiv"] }
        ]
      },
      "Fiat": {
        code: "FIA",
        models: [
          { name: "Punto Mk1 / Mk2 / Bravo–Brava (1993–2007)", engines: ["1.9 JTD (59/74/85 kW)", "1.2 8V / 16V (44/59 kW)"] },
          { name: "Grande Punto / Bravo II / Ducato (2005–2026)", engines: ["1.3 / 1.6 / 2.0 Multijet (55–130 kW)"] }
        ]
      },
      "Dacia": {
        code: "DAC",
        models: [
          { name: "Logan / Sandero / Duster I (2004–2017)", engines: ["1.5 dCi (50/55/63/66/80/81 kW / K9K)", "1.6 MPI / 16V (64/77 kW)"] },
          { name: "Duster II–III / Sandero III / Jogger (2018–2026)", engines: ["1.5 Blue dCi (70/85 kW)", "1.0 TCe / LPG (67/74 kW)", "Hybrid 140"] }
        ]
      }
    };

    const PARTS = {
      battery: {
        title: "12V Batéria, alternátor a štartér",
        steps: [
          "Zmerajte napätie batérie v pokoji (správne ~12,5–12,7 V) a pri bežiacom motore (~13,8–14,4 V).",
          "Skontrolujte ukostrenie motora, karosérie a svorky na oxidáciu.",
          "Pri novších autách so Start-Stop po výmene batérie zaregistrujte nový akumulátor."
        ],
        diy: "85 – 160 €",
        service: "130 – 240 €"
      },
      engine: {
        title: "Motor, rozvody a snímače",
        steps: [
          "Skontrolujte hladinu a stav oleja, prípadné úniky okolo veka ventilov a podtlakové hadice.",
          "Pri podozrení na nepravidelný chod skontrolujte palivový systém, zapaľovanie alebo snímač vačky/kľuky.",
          "Dodržte interval výmeny rozvodov a vodnej pumpy podľa ročníka a kódu motora."
        ],
        diy: "60 – 320 €",
        service: "180 – 750 €"
      },
      brakes: {
        title: "Brzdový systém a podvozok",
        steps: [
          "Skontrolujte hrúbku brzdových platničiek, stav kotúčov a voľný chod vodiacich čapov.",
          "Prezrite silentbloky ramien, čapy riadenia, tyčky stabilizátora a manžety poloos.",
          "Pri pískaní alebo trasení pri brzdení skontrolujte rovnomerné opotrebenie oboch strán."
        ],
        diy: "50 – 220 €",
        service: "120 – 420 €"
      },
      exhaust: {
        title: "Výfuk, EGR ventil a DPF / katalyzátor",
        steps: [
          "Skontrolujte tesnosť výfukového potrubia, pružný dielec a snímače teploty/tlaku výfukových plynov.",
          "Pri starších autách sledujte zanášanie EGR ventilu, pri novších autách stav DPF a aditíva/AdBlue.",
          "Pred výmenou drahých dielov overte únik vzduchu v sacom potrubí."
        ],
        diy: "45 – 260 €",
        service: "120 – 650 €"
      }
    };

    const brandKeys = Object.keys(DB);
    let selectedBrand = "Škoda";
    let selectedModelIdx = 0;
    let selectedEngineIdx = 0;
    let selectedPart = "battery";

    function renderBrands(filterText = "") {
      const grid = document.getElementById("brandGrid");
      const q = filterText.trim().toLowerCase();
      const filtered = brandKeys.filter(b => b.toLowerCase().includes(q) || DB[b].code.toLowerCase().includes(q));
      if (filtered.length && !filtered.includes(selectedBrand)) {
        selectedBrand = filtered[0];
        selectedModelIdx = 0;
        selectedEngineIdx = 0;
      }
      grid.innerHTML = filtered.map(brand => {
        const active = brand === selectedBrand;
        return `<button onclick="chooseBrand('${brand}')" class="p-3 rounded-xl border text-left transition ${
          active
            ? "bg-amber-500/15 border-amber-500 text-amber-200"
            : "bg-slate-950/70 border-slate-800 text-slate-200 hover:border-slate-600"
        }">
          <div class="font-mono text-xs font-bold ${active ? "text-amber-400" : "text-slate-400"}">${DB[brand].code}</div>
          <div class="text-sm font-semibold truncate">${brand}</div>
        </button>`;
      }).join("");
      renderModels();
    }

    function chooseBrand(brand) {
      selectedBrand = brand;
      selectedModelIdx = 0;
      selectedEngineIdx = 0;
      renderBrands(document.getElementById("brandFilter").value);
    }

    function renderModels() {
      const models = DB[selectedBrand].models;
      if (selectedModelIdx >= models.length) selectedModelIdx = 0;
      const modelSelect = document.getElementById("modelSelect");
      modelSelect.innerHTML = models.map((m, i) => `<option value="${i}" ${i === selectedModelIdx ? "selected" : ""}>${m.name}</option>`).join("");
      modelSelect.onchange = () => {
        selectedModelIdx = Number(modelSelect.value);
        selectedEngineIdx = 0;
        renderEngines();
      };
      renderEngines();
    }

    function renderEngines() {
      const engines = DB[selectedBrand].models[selectedModelIdx].engines;
      if (selectedEngineIdx >= engines.length) selectedEngineIdx = 0;
      const engineSelect = document.getElementById("engineSelect");
      engineSelect.innerHTML = engines.map((e, i) => `<option value="${i}" ${i === selectedEngineIdx ? "selected" : ""}>${e}</option>`).join("");
      engineSelect.onchange = () => {
        selectedEngineIdx = Number(engineSelect.value);
        updateBanner();
      };
      updateBanner();
    }

    function updateBanner() {
      const modelName = DB[selectedBrand].models[selectedModelIdx].name;
      const engineName = DB[selectedBrand].models[selectedModelIdx].engines[selectedEngineIdx];
      document.getElementById("activeVehicleBanner").innerHTML = `
        <div><span class="text-slate-400">Aktívne vozidlo:</span> <strong class="text-amber-300">${selectedBrand} ${modelName}</strong></div>
        <div class="font-mono text-xs text-slate-300">${engineName}</div>
      `;
      renderPartCard();
    }

    function selectPart(key) {
      selectedPart = key;
      renderPartCard();
    }

    function renderPartCard() {
      const p = PARTS[selectedPart];
      const modelName = DB[selectedBrand].models[selectedModelIdx].name;
      const engineName = DB[selectedBrand].models[selectedModelIdx].engines[selectedEngineIdx];
      document.getElementById("partDetailCard").innerHTML = `
        <div class="text-xs text-amber-400 font-semibold">${selectedBrand} • ${modelName}</div>
        <h3 class="text-lg font-bold">${p.title}</h3>
        <div class="text-xs font-mono text-slate-400">${engineName}</div>
        <ol class="list-decimal list-inside space-y-2 text-sm text-slate-200 pt-1">
          ${p.steps.map(s => `<li>${s}</li>`).join("")}
        </ol>
        <div class="grid grid-cols-2 gap-2.5 pt-2">
          <div class="rounded-xl bg-emerald-950/50 border border-emerald-700/40 p-3">
            <div class="text-[11px] text-emerald-300">Svojpomocne (diel)</div>
            <div class="font-bold text-sm text-emerald-200">${p.diy}</div>
          </div>
          <div class="rounded-xl bg-slate-950 border border-slate-800 p-3">
            <div class="text-[11px] text-slate-400">Autoservis (orientačne)</div>
            <div class="font-bold text-sm text-slate-100">${p.service}</div>
          </div>
        </div>
      `;
    }

    document.getElementById("brandFilter").addEventListener("input", (e) => renderBrands(e.target.value));
    renderBrands();
  </script>
</body>
</html>
